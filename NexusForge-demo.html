function getScenario(id) {

}



const defaultAssumptions = { downtimeRate: 48, delay: 0, unitsPerMinute: 8, scrapUnitCost: 12, energyRate: 0.28, riskWeight: 2000 };

function normalizeAssumptions(input = {}) {
  if (!input || typeof input !== 'object' || Array.isArray(input)) throw Object.assign(new Error('Assumptions must be an object.'), { status: 400 });
  const limits = { downtimeRate: [5, 250], delay: [0, 120], unitsPerMinute: [1, 100], scrapUnitCost: [0, 500], energyRate: [0.01, 5], riskWeight: [0, 20000] };
  const normalized = { ...defaultAssumptions };
  for (const [key, value] of Object.entries(input)) {
    if (!limits[key] || typeof value !== 'number' || !Number.isFinite(value) || value < limits[key][0] || value > limits[key][1]) {
      throw Object.assign(new Error(`Invalid assumption: ${key}.`), { status: 400 });
    }
    normalized[key] = value;
  }
  return normalized;
}

const rounded = value => Math.round(value * 100) / 100;

function simulate(scenarioId, input = {}, preparedScenario = null) {
  const scenario = preparedScenario || getScenario(scenarioId);
  const assumptions = normalizeAssumptions(input);
  const plans = scenario.plans.map(plan => {
    const delayMinutes = assumptions.delay * (plan.id === 'targeted' ? 1.35 : 1);
    const downtime = rounded(plan.minutes + delayMinutes);
    const blockedReasons = [...(plan.blockedReasons || [])];
    const deadline = scenario.decisionContext?.constraints.deadlineMinutes;
    if (plan.outcome === 'restorative' && deadline && downtime > deadline && plan.minutes <= deadline) blockedReasons.push(`Delay-adjusted interruption exceeds the ${deadline}-minute production constraint.`);
    const lostUnits = Math.ceil(downtime * assumptions.unitsPerMinute);
    const breakdown = {
      downtime: rounded(downtime * assumptions.downtimeRate), parts: plan.parts, labor: plan.labor,
      scrap: rounded((plan.scrap + Math.floor(assumptions.delay * 0.3)) * assumptions.scrapUnitCost),
      energy: rounded(plan.energy * assumptions.energyRate)
    };
    const cost = rounded(Object.values(breakdown).reduce((sum, amount) => sum + amount, 0));
    const risk = rounded(Math.min(0.95, plan.risk + assumptions.delay * 0.002));
    const score = rounded(cost + risk * assumptions.riskWeight);
    const uncertainty = rounded(cost * (0.12 + risk * 0.2));
    return { ...plan, blockedReasons, feasible: plan.feasible !== false && blockedReasons.length === 0, downtime, lostUnits, breakdown, cost, risk, score, range: [rounded(Math.max(0, cost - uncertainty)), rounded(cost + uncertainty)] };
  }).sort((first, second) => Number(second.feasible !== false) - Number(first.feasible !== false) || (second.goalTier || 0) - (first.goalTier || 0) || first.score - second.score);
  const baseline = plans.find(plan => plan.id === scenario.baseline);
  for (const plan of plans) {
    plan.savings = rounded(baseline.cost - plan.cost);
    plan.minutesSaved = rounded(baseline.downtime - plan.downtime);
    plan.unitsProtected = baseline.lostUnits - plan.lostUnits;
    if (plan.outcome === 'diagnostic') {
      plan.savings = null;
      plan.minutesSaved = null;
      plan.unitsProtected = null;
      plan.costScope = 'Diagnostic stage only; restoration cost and downtime remain unknown.';
    }
  }
  return {
    scenarioId, assumptions, plans, recommendedId: plans[0].id, baselineId: baseline.id,
    provenance: 'Deterministic simulation on synthetic inputs; not a validated digital twin or a forecast.',
    formula: 'Cost = downtime × €/min + parts + labor + scrap × €/unit + incremental kWh × €/kWh. Apply feasibility and restoration-vs-diagnosis goal priority first, then rank comparable outcomes by cost + assumed risk × risk weight.',
    uncertaintyNote: 'Illustrative sensitivity band, not a calibrated confidence interval.',
    horizonMinutes: 300
  };
}

const evidenceError = message => { throw Object.assign(new Error(message), { status: 400 }); };
const bounded = (value, lower = 0, upper = 1) => Math.max(lower, Math.min(upper, value));
const average = values => values.reduce((total, value) => total + value, 0) / values.length;

const measurementSpecs = {
  pressure_bar: { label: 'Manifold pressure', unit: 'bar', range: [0, 16] },
  torque_pct: { label: 'Axis torque', unit: '%', range: [0, 300] },
  temperature_c: { label: 'Cabinet temperature', unit: '°C', range: [-20, 160] },
  reject_pct: { label: 'Rejected output', unit: '%', range: [0, 100] },
  power_kw: { label: 'Electrical demand', unit: 'kW', range: [0, 500] },
  overlap_pct: { label: 'Start-cycle overlap', unit: '%', range: [0, 100] }
};

function parseCsv(text) {
  if (typeof text !== 'string' || !text.trim() || text.length > 180000) evidenceError('Supply a nonempty CSV smaller than 180 KB.');
  const rows = [];
  let row = [], field = '', quoted = false;
  text = text.replace(/^\uFEFF/, '');
  for (let index = 0; index < text.length; index++) {
    const character = text[index];
    if (character === '"') {
      if (quoted && text[index + 1] === '"') { field += '"'; index++; }
      else if (!quoted && field.trim()) evidenceError('CSV contains a misplaced quote.');
      else quoted = !quoted;
    } else if (character === ',' && !quoted) { row.push(field.trim()); field = ''; }
    else if ((character === '\n' || character === '\r') && !quoted) {
      if (character === '\r' && text[index + 1] === '\n') index++;
      row.push(field.trim()); if (row.some(value => value !== '')) rows.push(row); row = []; field = '';
    } else field += character;
  }
  if (quoted) evidenceError('CSV contains an unterminated quoted field.');
  row.push(field.trim()); if (row.some(value => value !== '')) rows.push(row);
  if (rows.length < 6 || rows.length > 2501) evidenceError('CSV must contain a header and 5–2500 observations.');
  const headers = rows.shift().map(value => value.toLowerCase());
  if (headers.length > 16 || new Set(headers).size !== headers.length) evidenceError('CSV headers must be unique, with at most 16 columns.');
  if (!headers.includes('timestamp')) evidenceError('CSV needs a timestamp column containing ISO timestamps.');
  const metrics = headers.filter(header => measurementSpecs[header]);
  if (metrics.length < 2) evidenceError('CSV needs at least two supported measurement columns.');
  let previous = -Infinity;
  const records = rows.map((values, index) => {
    if (values.length !== headers.length) evidenceError(`CSV row ${index + 2} has the wrong number of fields.`);
    const record = Object.fromEntries(headers.map((header, position) => [header, values[position]]));
    const timestamp = Date.parse(record.timestamp);
    if (!Number.isFinite(timestamp) || !/T/.test(record.timestamp) || timestamp <= previous) evidenceError(`CSV row ${index + 2} needs a strictly increasing ISO timestamp.`);
    previous = timestamp;
    const result = { timestamp: new Date(timestamp).toISOString() };
    for (const metric of metrics) {
      const value = Number(record[metric]);
      const [minimum, maximum] = measurementSpecs[metric].range;
      if (record[metric] === '' || !Number.isFinite(value) || value < minimum || value > maximum) evidenceError(`CSV row ${index + 2}: invalid ${metric}. Expected ${minimum}–${maximum} ${measurementSpecs[metric].unit}.`);
      result[metric] = value;
    }
    return result;
  });
  const stats = Object.fromEntries(metrics.map(metric => {
    const values = records.map(record => record[metric]);
    return [metric, { first: values[0], last: values.at(-1), mean: average(values), minimum: Math.min(...values), maximum: Math.max(...values), change: values.at(-1) - values[0], values }];
  }));
  return { records, stats, rowCount: records.length, durationSeconds: Math.round((previous - Date.parse(records[0].timestamp)) / 1000), metrics };
}

const planningFieldLimits = {
  stock_on_hand: [0, 999], part_lead_minutes: [0, 1440], repair_minutes: [5, 600],
  downtime_eur_per_minute: [5, 250], production_deadline_minutes: [5, 1440]
};

function extractPlanningFields(document) {
  if (typeof document !== 'string' || document.length > 30000) evidenceError('Reference text must be smaller than 30 KB.');
  const fields = {}, references = [];
  document.split(/\r?\n/).forEach((line, index) => {
    const match = line.match(/^\s*([a-z_]+)\s*:\s*(\d+(?:\.\d+)?)\s*$/);
    if (!match || !planningFieldLimits[match[1]]) return;
    const value = Number(match[2]), [minimum, maximum] = planningFieldLimits[match[1]];
    if (value < minimum || value > maximum || (match[1] === 'stock_on_hand' && !Number.isInteger(value))) evidenceError(`Reference line ${index + 1}: invalid ${match[1]}.`);
    if (Object.hasOwn(fields, match[1])) evidenceError(`Reference contains ambiguous duplicate ${match[1]} fields.`);
    fields[match[1]] = value;
    references.push({ field: match[1], value, line: index + 1, excerpt: line.trim() });
  });
  return { fields, references };
}

function ingestEvidence({ csv, document = '', name = 'Uploaded evidence', provenance = 'user_supplied', scenarioId }) {
  if (typeof name !== 'string' || name.length > 140) evidenceError('Case name must be at most 140 characters.');
  if (!['synthetic', 'user_supplied'].includes(provenance)) evidenceError('Declare synthetic or user_supplied provenance.');
  if (scenarioId && !['pressure', 'thermal', 'energy'].includes(scenarioId)) evidenceError('Unknown evidence family.');
  const telemetry = parseCsv(csv);
  const planning = extractPlanningFields(document);
  const pairAvailable = family => ({ pressure: ['pressure_bar', 'torque_pct'], thermal: ['temperature_c', 'reject_pct'], energy: ['power_kw', 'overlap_pct'] })[family].every(metric => telemetry.stats[metric]);
  const families = [
    ['pressure', (telemetry.stats.pressure_bar ? bounded((6.2 - telemetry.stats.pressure_bar.last) / 2.4) : 0) + (telemetry.stats.torque_pct ? bounded((telemetry.stats.torque_pct.last - 100) / 55) : 0)],
    ['thermal', (telemetry.stats.temperature_c ? bounded((telemetry.stats.temperature_c.last - 55) / 35) : 0) + (telemetry.stats.reject_pct ? bounded((telemetry.stats.reject_pct.last - 1) / 7) : 0)],
    ['energy', (telemetry.stats.power_kw ? bounded((telemetry.stats.power_kw.last - 50) / 50) : 0) + (telemetry.stats.overlap_pct ? bounded((telemetry.stats.overlap_pct.last - 30) / 60) : 0)]
  ].filter(([family]) => pairAvailable(family)).sort((first, second) => second[1] - first[1]);
  if (!families.length || (scenarioId && !pairAvailable(scenarioId))) evidenceError('Supply pressure_bar + torque_pct, temperature_c + reject_pct, or power_kw + overlap_pct for the chosen case.');
  const family = scenarioId || families[0][0];
  return { name: name.trim() || 'Uploaded evidence', provenance, scenarioId: family, csv, document, telemetry, planning, createdAt: new Date().toISOString() };
}

const entropy = weights => weights.reduce((total, weight) => total - (weight > 0 ? weight * Math.log2(weight) : 0), 0);

function expectedInformationGain(hypotheses, likelihoods) {
  const priors = hypotheses.map(hypothesis => hypothesis.weight);
  const positiveProbability = priors.reduce((sum, prior, index) => sum + prior * likelihoods[index], 0);
  const positive = priors.map((prior, index) => prior * likelihoods[index] / Math.max(positiveProbability, 1e-9));
  const negative = priors.map((prior, index) => prior * (1 - likelihoods[index]) / Math.max(1 - positiveProbability, 1e-9));
  return Math.max(0, entropy(priors) - positiveProbability * entropy(positive) - (1 - positiveProbability) * entropy(negative));
}

function diagnosticReasoning(evidence, testResult = 'unmeasured') {
  const stats = evidence.telemetry.stats;
  const value = metric => stats[metric]?.last;
  let candidates, tests, support, signalStrength, dataConflict = false;
  if (evidence.scenarioId === 'pressure') {
    const loss = bounded((6.2 - value('pressure_bar')) / 2.4), torque = bounded((value('torque_pct') - 100) / 55);
    signalStrength = Math.max(loss, torque);
    dataConflict = loss > 0.6 && torque < 0.15;
    support = [0.05 + 0.5 * loss + 0.35 * Math.min(loss, torque), 0.05 + 0.48 * loss, 0.05 + 0.85 * torque * (1 - loss), 0.05 + 0.7 * loss * (1 - torque)];
    candidates = [['seal', 'Pneumatic leakage', 'pressure_bar and torque_pct rise/fall together'], ['regulator', 'Regulator instability', 'A supply fault can also lower manifold pressure'], ['drive', 'Independent drive or mechanical fault', 'Elevated torque without pressure loss'], ['sensor', 'Pressure measurement discrepancy', 'Pressure loss without matching torque response']];
    tests = [
      { id: 'leak', name: 'Obtain an independent leak-verification result', positive: 'leak_confirmed', negative: 'pressure_holds', positiveLabel: 'Leak independently confirmed', negativeLabel: 'Pressure holds; leak not found', likelihoods: [0.94, 0.12, 0.05, 0.03] },
      { id: 'drive', name: 'Obtain the technician’s independent drive assessment', positive: 'drive_confirmed', negative: 'drive_cleared', positiveLabel: 'Drive fault independently confirmed', negativeLabel: 'Drive assessment normal', likelihoods: [0.08, 0.08, 0.92, 0.05] }
    ];
  } else if (evidence.scenarioId === 'thermal') {
    const heat = bounded((value('temperature_c') - 55) / 30), defects = bounded((value('reject_pct') - 1) / 6);
    signalStrength = Math.max(heat, defects);
    dataConflict = (heat > 0.65 && defects < 0.1) || (defects > 0.75 && heat < 0.1);
    support = [0.05 + 0.85 * Math.min(heat, defects), 0.05 + 0.9 * heat * (1 - defects), 0.05 + 0.9 * defects * (1 - heat)];
    candidates = [['cooling', 'Cooling restriction', 'Temperature and reject rate rise together'], ['sensor', 'Temperature measurement discrepancy', 'High reported temperature without quality drift'], ['material', 'Incoming-material variation', 'Quality drifts without a thermal explanation']];
    tests = [
      { id: 'cooling', name: 'Obtain a qualified cooling-system inspection result', positive: 'cooling_confirmed', negative: 'cooling_cleared', positiveLabel: 'Cooling restriction confirmed', negativeLabel: 'Cooling inspection normal', likelihoods: [0.94, 0.07, 0.06] },
      { id: 'material', name: 'Obtain an independent material-lot inspection result', positive: 'material_confirmed', negative: 'material_cleared', positiveLabel: 'Material issue confirmed', negativeLabel: 'Material lot accepted', likelihoods: [0.12, 0.08, 0.93] }
    ];
  } else {
    const demand = bounded((value('power_kw') - 50) / 40), overlap = bounded((value('overlap_pct') - 30) / 55);
    signalStrength = demand;
    dataConflict = demand > 0.65 && overlap < 0.15;
    support = [0.05 + 0.9 * Math.min(demand, overlap), 0.05 + 0.85 * demand * (1 - overlap), 0.06 + 0.2 * (1 - demand)];
    candidates = [['scheduling', 'Overlapping start cycles', 'High power coincides with overlapping starts'], ['base_load', 'Unmodeled load or process demand', 'Demand peak without matching cycle overlap'], ['meter', 'Meter or baseline discrepancy', 'The declared power baseline needs verification']];
    tests = [
      { id: 'overlap', name: 'Obtain a controls-engineer review of synchronized starts', positive: 'overlap_confirmed', negative: 'overlap_ruled_out', positiveLabel: 'Overlapping starts confirmed', negativeLabel: 'Overlap ruled out', likelihoods: [0.95, 0.09, 0.06] },
      { id: 'meter', name: 'Obtain an independent power-meter validation', positive: 'meter_fault', negative: 'meter_valid', positiveLabel: 'Meter discrepancy found', negativeLabel: 'Meter independently validated', likelihoods: [0.05, 0.06, 0.92] }
    ];
  }
  if (testResult !== 'unmeasured') {
    const selected = tests.find(test => test.positive === testResult || test.negative === testResult);
    if (!selected) evidenceError('Diagnostic result is not valid for this evidence family.');
    support = support.map((weight, index) => weight * (testResult === selected.positive ? selected.likelihoods[index] : 1 - selected.likelihoods[index]));
  }
  const total = support.reduce((sum, weight) => sum + weight, 0);
  const originalOrder = candidates.map(([id, label, explanation], index) => ({ id, label, explanation, weight: support[index] / total }));
  const observations = tests.filter(test => test.positive !== testResult && test.negative !== testResult).map(test => ({ ...test, informationGainBits: Math.round(expectedInformationGain(originalOrder, test.likelihoods) * 1000) / 1000 })).sort((first, second) => second.informationGainBits - first.informationGainBits);
  const hypotheses = [...originalOrder].sort((first, second) => second.weight - first.weight);
  const disagreement = dataConflict || (signalStrength > 0.3 && ['sensor', 'material', 'base_load', 'meter'].includes(hypotheses[0].id));
  const safetyHold = (value('temperature_c') ?? 0) >= 95 || (value('torque_pct') ?? 0) >= 185 || (value('pressure_bar') ?? 10) < 2;
  const nominal = signalStrength < 0.18;
  return {
    hypotheses, tests, nextObservation: observations[0] || null, testResult, disagreement, safetyHold, nominal,
    needsMoreEvidence: testResult === 'unmeasured' || disagreement || hypotheses[0].weight < 0.65 || nominal,
    signalStrength: Math.round(signalStrength * 100) / 100,
    label: safetyHold ? 'Safety review required' : nominal ? 'No supported intervention' : disagreement ? 'Conflicting evidence' : testResult === 'unmeasured' ? 'One more observation' : 'Evidence updated',
    method: 'Declared evidence weights updated with assumed test likelihoods. Not learned or clinically/industrially calibrated probabilities. Information gain is model-dependent.'
  };
}

function generatedCsv(end = {}, seed = 7, rows = 24) {

  const fields = Object.keys(baseline);
  const output = ['timestamp,' + fields.join(',')];

  const random = () => { randomState = (1664525 * randomState + 1013904223) >>> 0; return randomState / 4294967296; };
  for (let index = 0; index < rows; index++) {
    const fraction = index / (rows - 1);
    const timestamp = new Date(Date.UTC(2026, 9, 17, 12, 42, index * 5)).toISOString();
    const values = fields.map(field => {
      const destination = end[field] ?? baseline[field];
      const noise = index === 0 || index === rows - 1 ? 0 : (random() - 0.5) * (field === 'pressure_bar' || field === 'reject_pct' ? 0.08 : 0.8);
      return Math.max(0, baseline[field] + (destination - baseline[field]) * fraction + noise).toFixed(3);
    });
    output.push([timestamp, ...values].join(','));
  }
  return output.join('\n');
}

const rejectConstraint = message => { throw Object.assign(new Error(message), { status: 400 }); };

function prepareDecision(evidence, overrides = {}, verifiedExtraction = null) {
  if (!overrides || typeof overrides !== 'object' || Array.isArray(overrides)) rejectConstraint('Decision constraints must be an object.');
  const allowed = ['stock', 'leadMinutes', 'deadlineMinutes', 'testResult'];
  for (const key of Object.keys(overrides)) if (!allowed.includes(key)) rejectConstraint(`Unknown constraint: ${key}.`);
  const fields = { ...evidence.planning.fields };
  if (verifiedExtraction) {
    for (const [key, value] of Object.entries(verifiedExtraction)) {
      if (!planningFieldLimits[key] || fields[key] !== value) rejectConstraint('Extracted planning fields must match their source record.');
      fields[key] = value;
    }
  }
  const constraints = {
    stock: overrides.stock ?? fields.stock_on_hand ?? 0,
    leadMinutes: overrides.leadMinutes ?? fields.part_lead_minutes ?? 180,
    deadlineMinutes: overrides.deadlineMinutes ?? fields.production_deadline_minutes ?? 90,
    testResult: overrides.testResult ?? 'unmeasured'
  };
  for (const [key, maximum] of [['stock', 999], ['leadMinutes', 1440], ['deadlineMinutes', 1440]]) {
    if (!Number.isFinite(constraints[key]) || !Number.isInteger(constraints[key]) || constraints[key] < (key === 'deadlineMinutes' ? 5 : 0) || constraints[key] > maximum) rejectConstraint(`Invalid ${key}.`);
  }
  const reasoning = diagnosticReasoning(evidence, constraints.testResult);
  const scenario = getScenario(evidence.scenarioId);
  const metrics = { pressure: ['pressure_bar', 'torque_pct'], thermal: ['temperature_c', 'reject_pct'], energy: ['power_kw', 'overlap_pct'] }[scenario.id];
  const primary = evidence.telemetry.stats[metrics[0]], secondary = evidence.telemetry.stats[metrics[1]];
  scenario.sensor.current = primary.last;
  scenario.sensor.series = primary.values.filter((_, index) => index % Math.max(1, Math.floor(primary.values.length / 40)) === 0).slice(-80);
  scenario.secondary = { name: scenario.id === 'pressure' ? 'Axis torque' : scenario.id === 'thermal' ? 'Reject rate' : 'Start overlap', value: `${secondary.last.toFixed(1)}%`, change: `${secondary.change >= 0 ? '+' : ''}${secondary.change.toFixed(1)} points over the evidence window` };
  scenario.hypothesis = reasoning.nominal ? 'These readings do not support an equipment intervention.' : `${reasoning.hypotheses[0].label} has the strongest relative support in the declared evidence model. This remains a hypothesis.`;
  scenario.uncertainty = reasoning.safetyHold ? 'The independent policy requires safe isolation review and escalation. Do not use the model response as machine-control authorization.' : reasoning.disagreement ? 'The signals do not jointly support the usual intervention. Obtain an independent measurement before committing to equipment work.' : 'Relative support scores and test likelihoods are declared assumptions, not calibrated probabilities. A qualified human must verify any proposed cause and procedure.';
  scenario.subtitle = evidence.description || `${evidence.telemetry.rowCount} uploaded observations analyzed. ${reasoning.label}.`;
  scenario.severity = reasoning.safetyHold ? 'Critical' : reasoning.nominal ? 'Review' : 'High';
  scenario.chain[1].detail = `${primary.last.toFixed(1)} ${scenario.sensor.unit} · observed input`;
  scenario.chain[2].detail = scenario.secondary.value + ' · observed input';
  scenario.chain[0].label = reasoning.hypotheses[0].label;
  scenario.evidence = [
    { id: 'OBS-01', title: evidence.name, source: evidence.provenance === 'synthetic' ? 'Reproducible synthetic CSV · generated fixture' : 'Operator-uploaded CSV · authenticity not verified', section: `${evidence.telemetry.rowCount} rows · ${evidence.telemetry.durationSeconds}s · ${evidence.telemetry.records[0].timestamp}`, text: `${metrics[0]}: ${primary.first} → ${primary.last}. ${metrics[1]}: ${secondary.first} → ${secondary.last}. Values were parsed and validated from the supplied CSV, not generated by the language model.` },
    { id: 'REF-01', title: 'Planning record and engineering context', source: evidence.provenance === 'synthetic' ? 'Synthetic engineering handbook · not OEM guidance' : 'Operator-uploaded reference · unverified source', section: evidence.planning.references.map(reference => `${reference.field}: line ${reference.line}`).join('; ') || 'No structured planning fields found', text: evidence.document || 'No reference text was supplied. Planning uses conservative defaults.' },
    { id: 'MODEL-01', title: 'Declared diagnostic model', source: 'NexusForge authored engineering assumptions', section: 'Evidence weighting and observation selection', text: reasoning.method }
  ];
  if (constraints.testResult !== 'unmeasured') scenario.evidence.push({ id: 'TEST-01', title: 'Operator-supplied diagnostic observation', source: evidence.provenance === 'synthetic' ? 'Synthetic what-if observation · not a performed test' : 'Operator assertion · not independently verified', section: constraints.testResult, text: `The reviewer supplied ${constraints.testResult}. This application did not perform a physical test. This assertion updates the assumed likelihood model and is retained in the evidence pack.` });
  scenario.planningFields = fields;
  scenario.decisionContext = { caseId: evidence.id, name: evidence.name, provenance: evidence.provenance, reasoning, constraints, extractionReferences: evidence.planning.references };
  const confirmations = { pressure: 'leak_confirmed', thermal: 'cooling_confirmed', energy: 'overlap_confirmed' };
  const targetCause = { pressure: 'seal', thermal: 'cooling', energy: 'scheduling' };
  for (const plan of scenario.plans) {
    plan.blockedReasons = [];
    const requiresPart = plan.id !== 'inspect' && plan.parts > 0;
    plan.stock = requiresPart ? constraints.stock : plan.stock;
    if (requiresPart && constraints.stock < 1) plan.blockedReasons.push(`Required part unavailable; stated lead time ${constraints.leadMinutes} min.`);
    if (plan.id === 'targeted') {
      plan.minutes = Math.round((fields.repair_minutes ?? plan.minutes) * (1 + Math.max(0, reasoning.signalStrength - 0.7) * 0.25));
      if (constraints.testResult !== confirmations[scenario.id] || reasoning.hypotheses[0].id !== targetCause[scenario.id]) plan.blockedReasons.push('Independent confirmation of the proposed intervention is missing or contradicted.');
    }
    if (plan.id === 'replace' && !(scenario.id === 'pressure' && constraints.testResult === 'drive_confirmed' && reasoning.hypotheses[0].id === 'drive')) plan.blockedReasons.push('The conventional response has no verified physical justification in this case; comparison baseline only.');
    if (plan.id !== 'inspect' && reasoning.safetyHold) plan.blockedReasons.push('Independent safety escalation policy blocks this intervention.');
    if (plan.id !== 'inspect' && (reasoning.nominal || reasoning.disagreement)) plan.blockedReasons.push('Insufficient or contradictory evidence: do not commit to this repair.');
    if (plan.id !== 'inspect' && plan.minutes > constraints.deadlineMinutes) plan.blockedReasons.push(`Intervention exceeds the ${constraints.deadlineMinutes}-minute production constraint.`);
    if (plan.id === 'inspect') {
      if (reasoning.safetyHold) { plan.name = 'Escalate for safe-isolation review'; plan.description = 'Notify the qualified safety and operations leads. No repair or restart instruction is authorized.'; }
      else if (reasoning.nominal) { plan.name = 'Abstain & verify the baseline'; plan.description = 'Do not manufacture a fault. Have an operator validate the baseline before scheduling equipment work.'; plan.minutes = 5; plan.labor = 20; plan.scrap = 0; }
      else if (reasoning.needsMoreEvidence) { plan.name = 'Obtain the discriminating observation'; plan.description = reasoning.nextObservation?.name || 'Escalate the conflicting evidence to a qualified specialist.'; plan.minutes = 18; plan.labor = 55; plan.scrap = 0; }
    }
    plan.feasible = plan.blockedReasons.length === 0;
    plan.outcome = plan.id === 'inspect' ? 'diagnostic' : 'restorative';
    plan.goalTier = plan.id === 'inspect' ? 1 : 2;
  }
  return scenario;
}

function simulateEvidence(evidence, assumptions = {}, constraints = {}, verifiedExtraction = null) {
  const scenario = prepareDecision(evidence, constraints, verifiedExtraction);
  const derivedAssumptions = { ...(scenario.planningFields.downtime_eur_per_minute ? { downtimeRate: scenario.planningFields.downtime_eur_per_minute } : {}), ...assumptions };
  const simulation = simulate(scenario.id, derivedAssumptions, scenario);
  return { ...simulation, scenario, reasoning: scenario.decisionContext.reasoning, constraints: scenario.decisionContext.constraints, caseId: evidence.id, provenance: `${evidence.provenance === 'synthetic' ? 'Synthetic' : 'Unverified user-supplied'} input; computed comparison under declared engineering assumptions.`, planningSource: verifiedExtraction ? 'Validated Evolus extraction' : 'Deterministic extraction from source lines' };
}



function runEvaluation() {
  const start = performance.now();
  const checks = [];
  const check = (name, category, passed, detail) => checks.push({ name, category, passed: Boolean(passed), detail });
  const cases = [
    { id: 'pressure-leak', result: 'unmeasured', expected: 'inspect', label: 'Unverified leak must ask for evidence' },
    { id: 'pressure-leak', result: 'leak_confirmed', expected: 'targeted', label: 'Confirmed leak permits available targeted intervention' },
    { id: 'pressure-no-stock', result: 'leak_confirmed', expected: 'inspect', label: 'No stock must change the action' },
    { id: 'pressure-contradiction', result: 'unmeasured', expected: 'inspect', label: 'Contradictory readings must not trigger repair' },
    { id: 'drive-fault', result: 'drive_confirmed', expected: 'replace', label: 'Confirmed independent drive fault changes the diagnosis and plan', deadline: 300 },
    { id: 'thermal-drift', result: 'cooling_confirmed', expected: 'targeted', label: 'Cooling confirmation permits containment plan' },
    { id: 'energy-overlap', result: 'overlap_confirmed', expected: 'targeted', label: 'Scheduling evidence permits controls-reviewed intervention' },
    { id: 'safety-hold', result: 'cooling_confirmed', expected: 'inspect', label: 'Safety hold overrides even a confirmed fault' },
    { id: 'nominal', result: 'unmeasured', expected: 'inspect', label: 'Nominal readings must not invent a fault' }
  ];
  for (const item of cases) {
    const result = simulateEvidence(getSample(item.id), {}, { testResult: item.result, ...(item.deadline ? { deadlineMinutes: item.deadline } : {}) });
    check(item.label, 'decision contract', result.recommendedId === item.expected, { expected: item.expected, actual: result.recommendedId });
    check(`${item.id}: no blocked plan ranked first`, 'constraint safety', result.plans[0].feasible, { blockedPlans: result.plans.filter(plan => !plan.feasible).map(plan => plan.id) });
  }
  for (let seed = 1; seed <= 12; seed++) {
    const evidence = ingestEvidence({ csv: generatedCsv({ pressure_bar: 3.6 + seed * 0.025, torque_pct: 139 + seed }, seed * 13), document: syntheticManual, name: `Seeded perturbation ${seed}`, provenance: 'synthetic', scenarioId: 'pressure' });
    const unconfirmed = simulateEvidence(evidence, {}, {});
    const confirmed = simulateEvidence(evidence, {}, { testResult: 'leak_confirmed' });
    const blocked = simulateEvidence(evidence, {}, { testResult: 'leak_confirmed', stock: 0 });
    check(`Seed ${seed}: observation changes the action`, 'seeded perturbation', unconfirmed.recommendedId === 'inspect' && confirmed.recommendedId === 'targeted', { before: unconfirmed.recommendedId, after: confirmed.recommendedId });
    check(`Seed ${seed}: stock overrides the model`, 'seeded perturbation', blocked.recommendedId === 'inspect', { actual: blocked.recommendedId });
  }
  const confirmed = simulateEvidence(getSample('pressure-leak'), {}, { testResult: 'leak_confirmed' });
  const delayed = simulateEvidence(getSample('pressure-leak'), { delay: 60 }, { testResult: 'leak_confirmed' });
  check('Intervention delay cannot lower a fixed plan cost', 'numerical consistency', confirmed.plans.every(plan => delayed.plans.find(candidate => candidate.id === plan.id).cost >= plan.cost), {});
  check('Every cost reconciles to its components', 'numerical consistency', confirmed.plans.every(plan => Math.abs(Object.values(plan.breakdown).reduce((sum, value) => sum + value, 0) - plan.cost) < 0.011), {});
  return { generatedAt: new Date().toISOString(), suite: 'Synthetic decision-contract evaluation v3', checks, total: checks.length, passed: checks.filter(item => item.passed).length, elapsedMs: Math.round((performance.now() - start) * 100) / 100, disclosure: 'Synthetic authored cases and seeded perturbations. This evaluates declared decision contracts, not field accuracy or AMD model quality. Fixture design and solver share engineering assumptions; this is not an independent scientific benchmark.', liveModelEvaluated: false };
}



const fail = (message, status = 400) => { throw Object.assign(new Error(message), { status }); };

function createService(store, integrations) {
  const approving = new Set();
  const resolveEvidence = input => {
    if (!input.caseId) return null;
    if (typeof input.caseId !== 'string' || input.caseId.length > 100) fail('Invalid evidence case ID.');
    const evidence = store.case?.(input.caseId) || getSample(input.caseId);
    if (!evidence) fail('Evidence case not found.', 404);
    if (input.scenarioId && input.scenarioId !== evidence.scenarioId) fail('Evidence family does not match the selected scenario.');
    return evidence;
  };
  return {
    intake(input) {
      const evidence = { ...ingestEvidence(input), id: randomUUID() };
      store.saveCase(evidence);
      store.audit('evidence.ingested', { caseId: evidence.id, provenance: evidence.provenance, rowCount: evidence.telemetry.rowCount, planningFields: Object.keys(evidence.planning.fields) });
      return evidence;
    },
    preview(input) {
      const evidence = resolveEvidence(input);
      return evidence ? simulateEvidence(evidence, input.assumptions, input.constraints) : simulate(input.scenarioId, input.assumptions);
    },
    async investigate(input) {
      const { scenarioId, mode = 'demo', assumptions = {}, note = '' } = input;
      if (!['demo', 'live'].includes(mode)) fail('Mode must be demo or live.');
      if (typeof note !== 'string' || note.length > 2000) fail('Operator note must be at most 2000 characters.');
      const evidence = resolveEvidence(input);
      let simulation = evidence ? simulateEvidence(evidence, assumptions, input.constraints) : simulate(scenarioId, assumptions);
      let scenario = simulation.scenario || getScenario(scenarioId);
      const started = Date.now();
      let assessment = localAssessment(scenario);
      assessment.recommendedPlanId = simulation.recommendedId;
      const blocks = [];
      if (mode === 'live') {
        const results = await Promise.allSettled([integrations.knowledge(scenario), integrations.extract(scenario)]);
        for (const [index, result] of results.entries()) {
          blocks.push({ name: index === 0 ? 'Knowledge library' : 'Document extractor', status: result.status === 'fulfilled' ? 'completed' : 'unavailable', detail: result.status === 'fulfilled' ? 'Provider response validated' : result.reason.message });
        }
        if (results[1].status === 'fulfilled' && evidence) {
          const fields = results[1].value.planningFields;
          if (fields && Object.keys(fields).length) {
            simulation = simulateEvidence(evidence, assumptions, input.constraints, fields);
            scenario = simulation.scenario;
          } else {
            blocks[1] = { name: 'Document extractor', status: 'unavailable', detail: 'No source-validated planning fields returned. Live dispatch remains blocked.' };
          }
        }
        if (results[0].status === 'fulfilled') scenario.evidence.push(...results[0].value);
        if (results[1].status === 'fulfilled') scenario.extractedIncident = results[1].value;
        assessment = await integrations.assess(scenario, simulation, note);
        if (results[1].status === 'fulfilled') assessment.extractedIncident = results[1].value;
      } else {
        blocks.push({ name: 'Knowledge library', status: 'demo', detail: 'Local synthetic evidence; no Evolus call' }, { name: 'Document extractor', status: 'demo', detail: 'Local structured fixture; no Evolus call' });
      }
      if (mode === 'demo' && simulation.reasoning) assessment.rationale = `${simulation.reasoning.label}. Only feasible interventions are ranked. The preferred action follows the uploaded observations, source-extracted planning fields, declared constraints, and diagnostic result—not a fixed scenario label.`;
      const value = { id: randomUUID(), createdAt: new Date().toISOString(), scenarioId: scenario.id, caseId: evidence?.id || null, inputEvidence: evidence || null, mode, status: 'review_required', scenario, simulation, assessment, blocks, note, elapsedMs: Date.now() - started };
      store.saveInvestigation(value);
      store.audit('investigation.created', { investigationId: value.id, scenarioId, mode, provider: assessment.provider, model: assessment.model });
      return value;
    },
    async approve(input) {
      const { investigationId, planId, reviewer, checks } = input;
      if (typeof investigationId !== 'string' || investigationId.length > 100 || typeof planId !== 'string') fail('A valid investigation and plan are required.');
      if (typeof reviewer !== 'string' || reviewer.trim().length < 2 || reviewer.length > 100) fail('Enter the reviewing operator’s name (2–100 characters).');
      const investigation = store.investigation(investigationId);
      if (!investigation) fail('Investigation not found.', 404);
      const plan = investigation.simulation.plans.find(candidate => candidate.id === planId);
      if (!plan) fail('The selected plan is not part of this investigation.');
      if (plan.feasible === false) fail(`This intervention is blocked: ${plan.blockedReasons.join(' ')}`, 409);
      if (!Array.isArray(checks) || checks.length !== plan.checks.length || checks.some(value => value !== true)) fail('Every human-review check must be acknowledged.');
      const existing = store.orderFor(investigationId);
      if (existing) {
        if (existing.planId !== planId) fail('This investigation already has a different approved plan.', 409);
        return existing;
      }
      if (approving.has(investigationId)) fail('Approval is already in progress.', 409);
      if (investigation.mode === 'live' && investigation.blocks.some(block => block.status !== 'completed')) fail('Live dispatch is blocked: both Evolus evidence and extraction must complete successfully. Resolve integration setup and run a new investigation.', 409);
      approving.add(investigationId);
      const order = { id: `NF-${randomUUID().slice(0, 8).toUpperCase()}`, investigationId, planId, scenarioId: investigation.scenarioId, plan: plan.name, reviewer: reviewer.trim(), checks: [...plan.checks], createdAt: new Date().toISOString(), status: investigation.mode === 'demo' ? 'demo_approved' : 'pending', mode: investigation.mode, projectedSavings: plan.savings, cost: plan.cost, minutes: plan.downtime, part: plan.part };
      try {
        store.saveOrder(order);
        store.audit('approval.recorded', { orderId: order.id, reviewer: order.reviewer, mode: order.mode, planId });
        if (investigation.mode === 'live') {
          try {
            const response = await integrations.dispatch(order, order.id);
            order.status = 'submitted';
            order.providerReference = String(response.id ?? response.run_id ?? 'Provider accepted; completion not verified').slice(0, 200);
          } catch (error) {
            order.status = 'dispatch_unconfirmed';
            order.error = error.message;
          }
          store.saveOrder(order);
          store.audit(`workflow.${order.status}`, { orderId: order.id, status: order.status });
        }
        investigation.status = order.status;
        store.saveInvestigation(investigation);
        return order;
      } finally { approving.delete(investigationId); }
    }
  };
}

const standaloneStorageKey = 'nexusforge-standalone-v3';

try {
  const saved = JSON.parse(localStorage.getItem(standaloneStorageKey) || 'null');
  if (saved && typeof saved.investigations === 'object' && typeof saved.orders === 'object' && Array.isArray(saved.events)) standaloneState = { ...saved, cases: saved.cases || {} };
} catch { standalonePersistent = false; }

function standalonePersist() {
  try { localStorage.setItem(standaloneStorageKey, JSON.stringify(standaloneState)); } catch { standalonePersistent = false; }
}

async function standaloneHash(value) {
  const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(JSON.stringify(value)));
  return [...new Uint8Array(digest)].map(byte => byte.toString(16).padStart(2, '0')).join('');
}

let standaloneIntegrity = { valid: true, count: 0, head: 'GENESIS' };
let standaloneQueue = Promise.resolve();
async function standaloneVerify() {
  let previous = 'GENESIS';
  for (const event of standaloneState.events) {
    const { id, time, kind, body, previous_hash } = event;
    if (event.previous_hash !== previous || event.hash !== await standaloneHash({ id, time, kind, body, previous_hash })) {
      standaloneIntegrity = { valid: false, count: standaloneState.events.length };
      return;
    }
    previous = event.hash;
  }
  standaloneIntegrity = { valid: true, count: standaloneState.events.length, head: previous };
}

const standaloneReady = standaloneVerify();
const standaloneStore = {
  saveCase(value) { standaloneState.cases[value.id] = structuredClone(value); standalonePersist(); return value; },
  case(id) { return standaloneState.cases[id] ? structuredClone(standaloneState.cases[id]) : null; },
  cases() { return Object.values(standaloneState.cases).reverse(); },
  saveInvestigation(value) { standaloneState.investigations[value.id] = structuredClone(value); standalonePersist(); return value; },
  investigation(id) { return standaloneState.investigations[id] ? structuredClone(standaloneState.investigations[id]) : null; },
  investigations() { return Object.values(standaloneState.investigations).reverse().slice(0, 50); },
  saveOrder(value) { standaloneState.orders[value.id] = structuredClone(value); standalonePersist(); return value; },
  orderFor(id) { return Object.values(standaloneState.orders).find(order => order.investigationId === id) || null; },
  orders() { return Object.values(standaloneState.orders).reverse(); },
  audit(kind, data) {
    standaloneQueue = standaloneQueue.then(async () => {
      const previous = standaloneState.events.at(-1)?.hash || 'GENESIS';
      const event = { id: crypto.randomUUID(), time: new Date().toISOString(), kind, body: JSON.stringify(data), previous_hash: previous };
      const hash = await standaloneHash(event);
      standaloneState.events.push({ ...event, hash, data, sequence: standaloneState.events.length + 1 });
      standalonePersist();
      await standaloneVerify();
    });
  },
  auditLog() { return [...standaloneState.events].reverse().slice(0, 200); },
  verifyAudit() { return standaloneIntegrity; }
};

globalThis.fetch = async (path, options = {}) => {
  try {
    await standaloneReady;
    const input = options.body ? JSON.parse(options.body) : {};
    let result;
    let status = 200;
    if (path === '/api/bootstrap') result = { assets, scenarios, sampleCases, defaultCaseIds, cases: standaloneStore.cases(), defaultAssumptions, integrations: standaloneConnections, orders: standaloneStore.orders(), investigations: standaloneStore.investigations() };
    else if (path === '/api/health') result = { status: 'ok', mode: 'standalone-demo' };
    else if (path === '/api/simulate') result = standaloneService.preview(input);
    else if (path === '/api/cases') { result = standaloneService.intake(input); status = 201; }
    else if (path === '/api/evaluation') result = runEvaluation();
    else if (path === '/api/providers/verify') result = { status: 'offline_only', note: 'Use npm run verify:live from the full application on a connected laptop.' };
    else if (path === '/api/investigations') { result = await standaloneService.investigate(input); status = 201; }
    else if (path === '/api/approve') result = await standaloneService.approve(input);
    else if (path === '/api/orders') result = standaloneStore.orders();
    else if (path === '/api/integrations') result = standaloneConnections;
    else if (path === '/api/audit') { await standaloneVerify(); result = { events: standaloneStore.auditLog(), integrity: standaloneStore.verifyAudit() }; }
    else if (String(path).startsWith('/api/report/')) {
      const investigation = standaloneStore.investigation(String(path).split('/').pop());
      if (!investigation) throw Object.assign(new Error('Investigation not found.'), { status: 404 });
      result = { ...investigation, order: standaloneStore.orderFor(investigation.id), disclosure: `Standalone offline preview. ${investigation.inputEvidence?.provenance === 'user_supplied' ? 'User-supplied evidence; authenticity unverified.' : 'Synthetic data.'} Browser-local storage, no external calls or machine control.`, auditIntegrity: standaloneStore.verifyAudit() };
    } else throw Object.assign(new Error('Standalone route not found.'), { status: 404 });
    await standaloneQueue;
    return new Response(JSON.stringify(result), { status, headers: { 'Content-Type': 'application/json' } });
  } catch (error) {
    return new Response(JSON.stringify({ error: error.message }), { status: error.status || 500, headers: { 'Content-Type': 'application/json' } });
  }
};

function sensorChart() {
  const sensor = currentScenario().sensor;
  const minimum = Math.min(...sensor.series, sensor.threshold) * 0.85;
  const maximum = Math.max(...sensor.series, sensor.threshold) * 1.07;
  const project = value => 105 - (value - minimum) / (maximum - minimum) * 90;
  const points = sensor.series.map((value, index) => `${35 + index * 540 / (sensor.series.length - 1)},${project(value)}`).join(' ');
  return `<svg class="sensor-chart" viewBox="0 0 610 140" role="img" aria-label="${sensor.name} evidence trend from ${sensor.series[0]} to ${sensor.current} ${sensor.unit}"><defs><linearGradient id="sensor-fill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b299f0" stop-opacity=".15"/><stop offset="1" stop-color="#b299f0" stop-opacity="0"/></linearGradient></defs>${[25,65,105].map(position => `<line x1="35" y1="${position}" x2="580" y2="${position}" stroke="#ffffff08"/><text x="3" y="${position + 3}" fill="#677185" font-size="9">${number(minimum + (105 - position) / 90 * (maximum - minimum))}</text>`).join('')}<line x1="35" y1="${project(sensor.threshold)}" x2="580" y2="${project(sensor.threshold)}" stroke="#d9a378" stroke-opacity=".4" stroke-dasharray="4 4"/><polygon points="35,110 ${points} 575,110" fill="url(#sensor-fill)"/><polyline points="${points}" stroke="#b69bf4" stroke-width="2" fill="none" stroke-linejoin="round"/><circle cx="575" cy="${project(sensor.current)}" r="4" fill="#d4bfff" stroke="#382e4d" stroke-width="5"/><text x="35" y="132" fill="#697386" font-size="9">12:42:00</text><text x="275" y="132" fill="#697386" font-size="9">12:43:00</text><text x="537" y="132" fill="#697386" font-size="9">12:44:00</text></svg>`;
}

function futureChart() {
  const simulation = state.simulation;
  const best = bestPlan();
  const baseline = simulation.plans.find(plan => plan.id === simulation.baselineId);
  const horizon = Math.max(300, baseline.downtime + 30);
  const recovery = (plan, minute) => plan.outcome === 'diagnostic' || minute < state.assumptions.delay ? 46 : Math.min(94, 46 + Math.max(0, minute - plan.downtime) * 1.3);
  const curve = plan => Array.from({ length: 61 }, (_, index) => { const minute = index / 60 * horizon; return `${50 + minute / horizon * 840},${195 - recovery(plan, minute) / 100 * 160}`; }).join(' ');
  return `<svg class="future-chart" viewBox="0 0 940 230" role="img" aria-label="Illustrative recovery trajectories for the selected intervention versus the baseline. Not a forecast."><defs><linearGradient id="future-fill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ad8ef0" stop-opacity=".17"/><stop offset="1" stop-color="#ad8ef0" stop-opacity="0"/></linearGradient></defs>${[25,50,75,100].map(value => `<line x1="50" y1="${195 - value / 100 * 160}" x2="890" y2="${195 - value / 100 * 160}" stroke="#ffffff08"/><text x="10" y="${199 - value / 100 * 160}" fill="#727b8e" font-size="10">${value}%</text>`).join('')}<polygon points="50,195 ${curve(best)} 890,195" fill="url(#future-fill)"/><polyline points="${curve(baseline)}" fill="none" stroke="#d5a67d" stroke-width="2" stroke-dasharray="6 5"/><polyline points="${curve(best)}" fill="none" stroke="#bda0ff" stroke-width="3" stroke-linejoin="round"/>${[0,1,2,3,4,5].map(index => `<text x="${50 + index / 5 * 840}" y="220" fill="#727b8e" font-size="10" text-anchor="middle">${Math.round(index / 5 * horizon)} min</text>`).join('')}<line x1="${50 + best.downtime / horizon * 840}" y1="28" x2="${50 + best.downtime / horizon * 840}" y2="195" stroke="#ad8ef050" stroke-dasharray="3 4"/><text x="${60 + best.downtime / horizon * 840}" y="25" fill="#c6b0fc" font-size="10">Intervention ends · ${number(best.downtime)} min</text></svg>`;
}

const pageRenderers = { overview, twin: twinPage, futures, orders: ordersPage, evidence: evidencePage, audit: auditPage, settings: settingsPage, intake: studio.page };

function render() {
  twin?.destroy(); twin = null;
  app.innerHTML = shell();
  document.querySelector('#main').innerHTML = pageRenderers[state.page]();
  if (state.page === 'overview') document.querySelector('.operations-grid')?.insertAdjacentHTML('beforebegin', studio.decisionPanel(true));
  if (state.page === 'futures') document.querySelector('.lab-controls')?.insertAdjacentHTML('beforebegin', studio.decisionPanel());
  if (state.page === 'settings') document.querySelector('.heading-actions')?.insertAdjacentHTML('beforeend', button('Verify providers', 'verify-providers', 'primary', 'bolt'));
  const canvas = document.querySelector('#factory-canvas');
  if (canvas) {
    twin = new FactoryTwin(canvas, state.assets, id => selectAsset(id));
    twin.setScenario(currentScenario()); twin.selected = state.selectedAsset; twin.layer = state.layer; twin.playing = state.playing;
  }
  bindSliders();
  studio.bind();
  if (state.guideStep >= 0) renderGuide();
}

function refreshAgent() {
  const panel = document.querySelector('.intelligence-panel');
  if (panel) panel.outerHTML = agentCard();
}

function navigate(page) {
  if (state.page === page) { render(); return; }
  location.hash = page;
}

async function refreshAudit() {
  state.audit = await api('/api/audit');
  if (state.page === 'audit') render();
}

async function setScenario(id) {
  if (state.busy || state.caseUpdating) { toast('Let the current operation finish first.'); return; }
  if (!state.scenarios.some(scenario => scenario.id === id)) return;
  clearTimeout(simulationTimer);
  const revision = ++simulationRevision;
  const nextCaseId = state.defaultCaseIds[id];
  const simulation = await api('/api/simulate', { scenarioId: id, assumptions: state.assumptions, caseId: nextCaseId, constraints: {} });
  if (revision !== simulationRevision) return;
  state.scenarioId = id; state.caseId = nextCaseId; state.constraints = { testResult: 'unmeasured' }; applySimulation(simulation); state.investigation = null;
  state.selectedAsset = currentScenario().assetId; state.error = null; state.selectedPlan = 'targeted';
  closeModal(); render(); toast(`${currentScenario().name} loaded. All inputs are synthetic.`);
}

function selectAsset(id) {
  state.selectedAsset = id;
  if (state.page === 'twin') { render(); return; }
  if (twin) twin.selected = id;
  document.querySelectorAll('.asset-chip').forEach(chip => chip.classList.toggle('selected', chip.dataset.id === id));
  const asset = state.assets.find(item => item.id === id);
  toast(`${asset.code} · ${asset.name}. Open Digital twin for the asset inspector.`);
}

async function investigate({ stay = false } = {}) {
  if (state.busy || state.caseUpdating) return;
  clearTimeout(simulationTimer);
  simulationRevision++;
  state.busy = true; state.progress = 0; state.error = null; state.investigation = null;
  if (!stay && state.page !== 'overview') { state.page = 'overview'; history.replaceState(null, '', '#overview'); }
  render();
  const resultPromise = api('/api/investigations', { scenarioId: state.scenarioId, mode: state.mode, assumptions: state.assumptions, ...casePayload() }).then(result => ({ result }), error => ({ error }));
  for (let index = 0; index < 4; index++) { state.progress = index; refreshAgent(); await wait(matchMedia('(prefers-reduced-motion: reduce)').matches ? 80 : 470); }
  const { result, error } = await resultPromise;
  state.busy = false;
  if (error) { state.error = error.message; render(); toast(error.message, 'error'); return null; }
  state.investigation = result; applySimulation(result.simulation); state.investigations.unshift(result);
  state.selectedPlan = result.simulation.recommendedId;
  render();
  toast(state.mode === 'demo' ? 'Investigation complete. Three recovery paths are ready for review.' : 'Live assessment recorded. Review provider receipts before proceeding.');
  return result;
}

function bindSliders() {
  document.querySelectorAll('.lab-controls input, [data-action="reset-assumptions"]').forEach(element => element.disabled = state.busy);
  document.querySelector('#delay-slider')?.addEventListener('input', event => {
    state.assumptions.delay = Number(event.target.value);
    document.querySelector('#delay-value').textContent = `${state.assumptions.delay} min`;
    scheduleSimulation();
  });
  document.querySelector('#rate-slider')?.addEventListener('input', event => {
    state.assumptions.downtimeRate = Number(event.target.value);
    document.querySelector('#rate-value').textContent = `${money(state.assumptions.downtimeRate)} / min`;
    scheduleSimulation();
  });
}

function scheduleSimulation() {
  clearTimeout(simulationTimer);
  state.investigation = null;
  simulationRevision++;
  const revision = simulationRevision;
  document.querySelectorAll('[data-action="review-plan"]').forEach(element => element.disabled = true);
  simulationTimer = setTimeout(async () => {
    try {
      const result = await api('/api/simulate', { scenarioId: state.scenarioId, assumptions: state.assumptions, ...casePayload() });
      if (revision !== simulationRevision) return;
      applySimulation(result);
      if (state.page === 'futures') {
        document.querySelector('#future-chart-wrap').innerHTML = futureChart();
        document.querySelector('#plan-grid').innerHTML = planCards();
      }
    } catch (error) { toast(error.message, 'error'); }
  }, 150);
}

function showModal(content, className = '') {
  lastFocus = document.activeElement;
  modalRoot.innerHTML = `<div class="modal-overlay"><section class="modal ${className}" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button class="modal-close icon-button" data-action="close-modal" aria-label="Close dialog">${icon('close')}</button>${content}</section></div>`;
  document.body.classList.add('modal-open');
  requestAnimationFrame(() => modalRoot.querySelector('input, button')?.focus());
}

function closeModal() {
  if (approvalLocked) return;
  modalRoot.innerHTML = ''; document.body.classList.remove('modal-open'); lastFocus?.focus();
}

  showModal(`<span class="modal-eyebrow">ONE FACTORY. THREE DIFFERENT CHALLENGES.</span><h2 id="modal-title">Choose a future to change.</h2><p class="modal-intro">Realistic situations. Explicitly synthetic data. A different decision every time.</p><div class="scenario-options">${state.scenarios.map((scenario, index) => `<button data-action="select-scenario" data-id="${scenario.id}" class="scenario-option ${state.scenarioId === scenario.id ? 'selected' : ''}"><span class="scenario-option-icon">${icon(['activity', 'eye', 'bolt'][index])}</span><div><span class="eyebrow">${scenario.category}</span><h3>${scenario.name}</h3><p>${scenario.subtitle}</p></div>${icon(state.scenarioId === scenario.id ? 'check' : 'arrow')}</button>`).join('')}</div><div class="modal-footnote">${icon('info')} No factory equipment is connected or controlled.</div>`, 'scenario-modal');
}

async function reviewPlan(planId) {
  if (state.busy) return;
  if (!state.investigation) {
    const result = await investigate({ stay: true });
    if (!result) return;
  }
  const plan = state.investigation.simulation.plans.find(candidate => candidate.id === (planId || state.simulation.recommendedId));
  if (!plan) return;
  state.selectedPlan = plan.id;
  const existing = state.orders.find(order => order.investigationId === state.investigation.id);
  if (existing) { orderModal(existing); return; }
  showModal(`<span class="modal-eyebrow">HUMAN REVIEW / ${state.mode === 'demo' ? 'SIMULATED ACTION' : 'LIVE WORKFLOW REQUEST'}</span><h2 id="modal-title">A good decision needs you.</h2><p class="modal-intro">${safe(plan.name)}. ${state.mode === 'demo' ? 'This records a local demo approval. Nothing is sent to a real factory or ERP.' : 'Approval requests the configured Evolus workflow; completion is not assumed.'}</p><div class="approval-summary"><div><span>Modeled cost</span><strong>${money(plan.cost)}</strong></div><div><span>Interruption</span><strong>${number(plan.downtime)} min</strong></div><div><span>vs. baseline</span><strong class="positive">${plan.savings == null ? 'Unknown' : money(plan.savings)}</strong></div></div><div class="approval-uncertainty">${icon('alert')}<p>${safe(state.investigation.assessment.uncertainty)}</p></div><form id="approval-form"><label class="field-label" for="reviewer">Reviewing operator</label><input id="reviewer" name="reviewer" placeholder="Enter your full name" minlength="2" maxlength="100" required autocomplete="name"><div class="review-checks"><span class="field-label">${state.mode === 'demo' ? 'Acknowledge the demo review requirements' : 'Confirm all required checks'}</span>${plan.checks.map((check, index) => `<label><input type="checkbox" name="check-${index}" required><span>${safe(check)}</span></label>`).join('')}</div><div id="approval-error" role="alert"></div><button type="submit" class="button primary full" id="approve-button">${icon('shield')}<span>${state.mode === 'demo' ? 'Approve demo work order' : 'Approve & request workflow'}</span>${icon('arrow')}</button></form><div class="modal-footnote">${icon('shield')} Local acknowledgement, not verified production authorization.</div>`, 'approval-modal');
  document.querySelector('#approval-form').addEventListener('submit', submitApproval);
}

async function submitApproval(event) {
  event.preventDefault();
  if (approvalLocked) return;
  const form = event.currentTarget;
  if (!form.reportValidity()) return;
  const submit = document.querySelector('#approve-button');
  submit.disabled = true; submit.innerHTML = '<span class="spinner"></span> Recording decision…'; approvalLocked = true;
  try {
    const order = await api('/api/approve', { investigationId: state.investigation.id, planId: state.selectedPlan, reviewer: form.elements.reviewer.value.trim(), checks: [...form.querySelectorAll('input[type="checkbox"]')].map(input => input.checked) });
    state.orders = [order, ...state.orders.filter(previous => previous.id !== order.id)];
    approvalLocked = false; closeModal(); render(); orderModal(order);
    toast(order.status === 'dispatch_unconfirmed' ? 'Provider execution is unconfirmed. Check the workspace before retrying.' : 'Decision recorded with your review and a timestamp.', order.status === 'dispatch_unconfirmed' ? 'error' : 'info');
  } catch (error) {
    approvalLocked = false;
    document.querySelector('#approval-error').innerHTML = `<div class="inline-error">${safe(error.message)}</div>`;
    submit.disabled = false; submit.innerHTML = `${icon('shield')} Retry approval`;
  }
}

function orderModal(order) {
  const confirmed = ['demo_approved', 'submitted'].includes(order.status);
  showModal(`<div class="success-mark ${confirmed ? '' : 'unconfirmed'}">${icon(confirmed ? 'check' : 'alert')}</div><span class="modal-eyebrow">${safe(order.id)} / ${order.mode.toUpperCase()}</span><h2 id="modal-title">${order.status === 'demo_approved' ? 'Your decision. On the record.' : order.status === 'submitted' ? 'Workflow request accepted.' : 'Execution is not confirmed.'}</h2><p class="modal-intro">${order.status === 'demo_approved' ? 'Demo work order saved locally. No ERP call, purchase, or physical action has taken place.' : order.status === 'submitted' ? 'The provider accepted the request. Verify completion in the Evolus workspace.' : safe(order.error || 'Check the provider workspace before taking further action.')}</p><div class="receipt"><div><span>Approved plan</span><strong>${safe(order.plan)}</strong></div><div><span>Reviewer</span><strong>${safe(order.reviewer)}</strong></div><div><span>Recorded at</span><strong>${new Date(order.createdAt).toLocaleString('en-GB')}</strong></div><div><span>Projected value</span><strong>${order.projectedSavings == null ? 'Not comparable: diagnosis only' : money(order.projectedSavings)}</strong></div><div><span>Status</span>${pill(order.status.replaceAll('_', ' '), confirmed ? 'purple-pill' : 'amber-pill')}</div></div><div class="modal-button-row">${button('Export evidence pack', 'export-order', 'secondary', 'download', `data-id="${order.investigationId}"`)}${button('View action center', 'go-orders', 'primary', 'arrow')}</div>`, 'receipt-modal');
}

  const card = document.createElement('aside'); card.className = 'guide-card'; card.setAttribute('aria-label', 'Demo walkthrough');
  card.innerHTML = `<div class="guide-top"><span class="eyebrow">THE NEXUSFORGE STORY / 0${state.guideStep + 1}</span><button class="icon-button" data-action="end-guide" aria-label="End walkthrough">${icon('close')}</button></div><h3>${step.title}</h3><p>${step.text}</p><div class="guide-bottom"><div class="guide-dots">${guideSteps.map((_, index) => `<i class="${index === state.guideStep ? 'active' : ''}"></i>`).join('')}</div>${button(step.label, 'next-guide', 'primary small-button', 'arrow')}</div>`;
  document.body.append(card);

async function exportReport(id) {
  const report = await api(`/api/report/${encodeURIComponent(id)}`);
  const url = URL.createObjectURL(new Blob([JSON.stringify(report, null, 2)], { type: 'application/json' }));
  const anchor = document.createElement('a'); anchor.href = url; anchor.download = `nexusforge-evidence-${id.slice(0, 8)}.json`; anchor.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('Evidence pack exported with assumptions, provenance, and the approval receipt.');
}

  'command-go': element => { closeModal(); element.dataset.value === 'scenario' ? scenarioModal() : navigate(element.dataset.value); },
  alerts: () => { navigate('overview'); toast(currentScenario().signal); },
  about: () => showModal(`<span class="modal-eyebrow">NEXUSFORGE / VERSION 2.0</span><h2 id="modal-title">Intelligence with a point of view.</h2><p class="modal-intro">A decision-first industrial prototype for the AMD Developer Hackathon: ACT III. Built around one belief: the best autonomous system knows where human judgment belongs.</p><div class="about-principles"><div>${icon('branch')} Compare, don’t just predict.</div><div>${icon('book')} Show evidence, not invented confidence.</div><div>${icon('shield')} Propose freely. Act with approval.</div></div><div class="notice">${icon('info')}<p>This is a local, single-operator demo with synthetic factory data. It has no machine-control connection, verified user identity, or production safety certification.</p></div>`),
  menu: () => { state.menuOpen = !state.menuOpen; document.querySelector('.sidebar').classList.toggle('mobile-open', state.menuOpen); },
  guide: () => { state.guideStep = 0; state.page = 'overview'; history.replaceState(null, '', '#overview'); render(); },
  'next-guide': () => { state.guideStep++; if (state.guideStep >= guideSteps.length) { state.guideStep = -1; document.querySelector('.guide-card')?.remove(); navigate('futures'); toast('Choose a recovery plan and make the final call.'); } else { state.page = guideSteps[state.guideStep].page; history.replaceState(null, '', `#${state.page}`); render(); } },
  'end-guide': () => { state.guideStep = -1; document.querySelector('.guide-card')?.remove(); }
};

document.addEventListener('click', async event => {
  const actionElement = event.target.closest('[data-action]');
  if (actionElement && !actionElement.disabled) {
    try { await actions[actionElement.dataset.action]?.(actionElement); } catch (error) { toast(error.message, 'error'); }
  }
  if (event.target.classList.contains('modal-overlay')) closeModal();
});

document.addEventListener('keydown', event => {
  if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k') { event.preventDefault(); commandModal(); }
  if (event.key === 'Escape') { closeModal(); state.menuOpen = false; document.querySelector('.sidebar')?.classList.remove('mobile-open'); }
  if (event.key === 'Tab' && modalRoot.firstChild) {
    const focusable = [...modalRoot.querySelectorAll('button:not(:disabled), input, a[href], [tabindex="0"]')].filter(element => !element.hidden && element.offsetParent !== null);
    const first = focusable[0], last = focusable.at(-1);
    if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last?.focus(); }
    else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first?.focus(); }
  }
});

window.addEventListener('hashchange', async () => {
  state.page = location.hash.slice(1) || 'overview'; state.menuOpen = false;
  if (!state.scenarios.length) return;
  render(); window.scrollTo({ top: 0, behavior: 'instant' });
  if (state.page === 'audit') { try { await refreshAudit(); } catch (error) { toast(error.message, 'error'); } }
});

async function boot() {
  try {
    const data = await api('/api/bootstrap');
    Object.assign(state, { assets: data.assets, scenarios: data.scenarios, orders: data.orders, investigations: data.investigations, integrations: data.integrations, defaultAssumptions: data.defaultAssumptions, assumptions: { ...data.defaultAssumptions } });
    Object.assign(state, { sampleCases: data.sampleCases || [], cases: data.cases || [], defaultCaseIds: data.defaultCaseIds || {}, caseId: data.defaultCaseIds?.pressure || null });
    applySimulation(await api('/api/simulate', { scenarioId: state.scenarioId, assumptions: state.assumptions, ...casePayload() }));
    render();
    if (state.page === 'audit') await refreshAudit();
  } catch (error) {
    app.innerHTML = `<div class="boot-screen"><div class="boot-mark">N<span>›</span></div><h1>Let’s reconnect.</h1><p>${safe(error.message)}</p><button class="button primary" id="retry-boot">Retry connection</button></div>`;
    document.querySelector('#retry-boot').addEventListener('click', boot);
  }
}

setInterval(() => { const clock = document.querySelector('#clock'); if (clock) clock.textContent = time(Date.now()); }, 1000);
boot();
</script>
</body>
</html>
